name: Build check

# Three triggers:
#  - push:     ship changes as soon as they land on main
#  - schedule: re-pull ShelterManager so adopted dogs drop off the site
#  - manual:   "Run workflow" button when someone needs it refreshed now
on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. Dogs are added and adopted throughout the day, and a
    # stale listing means applications for a dog who is already home.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# A scheduled run and a push run must never deploy over each other.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Adoptable dogs turn over constantly, so this runs every time.
      - name: Refresh available dogs
        run: npm run fetch:dogs

      # Alumni costs ~25 requests of several MB each to derive adoption months.
      # Worth it, but not eight times a day — once daily is plenty, and pushes
      # and manual runs always refresh so you are never stuck with stale data.
      - name: Decide whether to refresh alumni
        id: alumni
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "06" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh alumni
        if: steps.alumni.outputs.refresh == 'true'
        run: npm run fetch:alumni

      # Data is already fetched above, so build without re-fetching.
      - name: Build site
        run: npm run build:offline

      # Deploying is Netlify's job now.
      #
      # The site ran on Cloudflare Workers until 2026-08-14, when the
      # Cloudflare account was deleted — see STATUS.md. Netlify builds and
      # publishes on every push to main by itself, so this workflow no longer
      # deploys anything. What it still earns its keep doing is proving, on a
      # schedule, that a fresh ShelterManager fetch and a full build both
      # succeed — which is how we learn the feed changed shape before visitors
      # do.
      # A volunteer adding a dog in ShelterManager sees it on /dogs within
      # minutes — the browser reconciles against the live feed. But that dog
      # has no page of its own and no optimised photos until the site is built
      # again, and pushes are the only thing that build it. So: rebuild on a
      # schedule too.
      #
      # Only twice a day, though. Netlify's free tier allows 300 build minutes
      # a month; at roughly two minutes a build, rebuilding every three hours
      # would spend about 480 and stop deploying partway through the month.
      # Twice a day costs ~120 and leaves plenty of headroom. The gap is
      # covered by the live layer, which is the whole point of it.
      #
      # The check above still runs every three hours regardless — that is free,
      # and it is how we learn the ShelterManager feed changed shape.
      - name: Trigger a Netlify rebuild
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.run_attempt > 0))
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          hour=$(date -u +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "06" ] && [ "$hour" != "18" ]; then
            echo "::notice::Verified only — scheduled rebuilds run at 06:00 and 18:00 UTC."
            exit 0
          fi
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not set, so nothing was rebuilt."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
            echo "::notice::Netlify rebuild triggered (HTTP $code)."
          else
            echo "::error::Netlify build hook returned HTTP $code — the site will go stale until this is fixed."
            exit 1
          fi

      - name: Report
        run: |
          echo "::notice::Build verified. Netlify publishes from main on push."
