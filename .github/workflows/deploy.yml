name: Build and deploy to Cloudflare Pages

# Three triggers:
#  - push:     ship changes as soon as they land on main
#  - schedule: re-pull ShelterManager so adopted dogs drop off the site
#  - manual:   "Run workflow" button for when someone needs it refreshed now
on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. Dogs are added and adopted throughout the day, and a
    # stale listing means applications for a dog that is already home.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# A scheduled run and a push run must never deploy over each other.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # Lifted to job level so the deploy step's `if:` can read them. A secret
    # referenced directly in an `if:` is always empty.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-fetches dogs from ShelterManager, then builds. Photos already in the
      # repo are reused; only new dogs cost a download.
      - name: Build site
        run: npm run build

      # Until the Cloudflare secrets exist, verify the build and stop there
      # rather than failing the run on a deploy nobody configured yet.
      - name: Skip deploy (Cloudflare secrets not set)
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::notice::Build succeeded. Deploy skipped — add the"
          echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"
          echo "::notice::under Settings > Secrets and variables > Actions to enable it."

      # Deploys the static-asset Worker defined in wrangler.jsonc — the same
      # command as `npm run deploy` locally, so CI and local cannot drift.
      - name: Deploy to Cloudflare
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: deploy
