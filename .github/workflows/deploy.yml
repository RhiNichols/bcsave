name: Build check

# Three triggers:
#  - push:     ship changes as soon as they land on main
#  - schedule: re-pull ShelterManager so adopted dogs drop off the site
#  - manual:   "Run workflow" button when someone needs it refreshed now
on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. Dogs are added and adopted throughout the day, and a
    # stale listing means applications for a dog who is already home.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# A scheduled run and a push run must never deploy over each other.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Adoptable dogs turn over constantly, so this runs every time.
      - name: Refresh available dogs
        run: npm run fetch:dogs

      # Alumni costs ~25 requests of several MB each to derive adoption months.
      # Worth it, but not eight times a day — once daily is plenty, and pushes
      # and manual runs always refresh so you are never stuck with stale data.
      - name: Decide whether to refresh alumni
        id: alumni
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "06" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh alumni
        if: steps.alumni.outputs.refresh == 'true'
        run: npm run fetch:alumni

      # Data is already fetched above, so build without re-fetching.
      - name: Build site
        run: npm run build:offline

      # Deploying is Netlify's job now.
      #
      # The site ran on Cloudflare Workers until 2026-08-14, when the
      # Cloudflare account was deleted — see STATUS.md. Netlify builds and
      # publishes on every push to main by itself, so this workflow no longer
      # deploys anything. What it still earns its keep doing is proving, on a
      # schedule, that a fresh ShelterManager fetch and a full build both
      # succeed — which is how we learn the feed changed shape before visitors
      # do.
      - name: Report
        run: |
          echo "::notice::Build verified. Netlify publishes from main on push."
