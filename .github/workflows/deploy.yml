name: Build and deploy

# Three triggers:
#  - push:     ship changes as soon as they land on main
#  - schedule: re-pull ShelterManager so adopted dogs drop off the site
#  - manual:   "Run workflow" button when someone needs it refreshed now
on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. Dogs are added and adopted throughout the day, and a
    # stale listing means applications for a dog who is already home.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# A scheduled run and a push run must never deploy over each other.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # Lifted to job level so the deploy step's `if:` can read them. A secret
    # referenced directly in an `if:` always evaluates empty.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Adoptable dogs turn over constantly, so this runs every time.
      - name: Refresh available dogs
        run: npm run fetch:dogs

      # Alumni costs ~25 requests of several MB each to derive adoption months.
      # Worth it, but not eight times a day — once daily is plenty, and pushes
      # and manual runs always refresh so you are never stuck with stale data.
      - name: Decide whether to refresh alumni
        id: alumni
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "06" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh alumni
        if: steps.alumni.outputs.refresh == 'true'
        run: npm run fetch:alumni

      # Data is already fetched above, so build without re-fetching.
      - name: Build site
        run: npm run build:offline

      # Until the Cloudflare secrets exist, verify the build and stop there
      # rather than failing the run on a deploy nobody configured yet.
      - name: Skip deploy (Cloudflare secrets not set)
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::notice::Build succeeded. Deploy skipped — add the"
          echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"
          echo "::notice::under Settings > Secrets and variables > Actions."

      # Runs the wrangler pinned in package-lock.json — the same binary
      # `npm run deploy` uses locally, so CI and a laptop cannot drift.
      #
      # This used to be cloudflare/wrangler-action@v3, which fetches its own
      # wrangler and reports failures as bare "The process '…/npx' failed with
      # exit code 1" with wrangler's actual error hidden inside a collapsed log
      # group — unreadable without a GitHub login. Every scheduled run failed
      # that way for days. Calling wrangler directly keeps its error in the
      # log, and the trap below repeats the tail as an ::error:: annotation,
      # which is visible from the API without authenticating.
      - name: Deploy to Cloudflare
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          if npx --no-install wrangler deploy 2>&1 | tee deploy.log; then
            exit 0
          fi

          tail=$(tail -c 900 deploy.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')

          # A rejected credential is a configuration state, not a broken build.
          # Treating it as a hard failure meant eight identical "run failed"
          # emails a day for something no amount of re-running could fix, which
          # trains you to ignore the one that eventually matters. Say it once,
          # visibly, and let the run pass — the build above still proves the
          # site compiles, and /dogs corrects itself against ShelterManager in
          # the browser, so nothing is silently rotting while this is unset.
          if grep -qE 'code: (9109|10000)|Invalid access token|Authentication error' deploy.log; then
            echo "::warning::Cloudflare rejected CLOUDFLARE_API_TOKEN — the site was built and verified but NOT deployed. Replace that secret to re-enable automatic deploys. ($tail)"
            exit 0
          fi

          # Anything else is a real failure and should shout.
          echo "::error::wrangler deploy failed — $tail"
          exit 1
